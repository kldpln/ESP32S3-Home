<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <!--设置显示比例自适应-->
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <!--设置网页标题-->
        <title>温湿度监控系统</title>
        <!-- 阻止浏览器自动去请求 favicon.ico 网站图标 -->
        <link rel="icon" href="data:,">
        <style>
            /* 全局样式重置 */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html {
                background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
                min-height: 100%;
            }

            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                color: rgb(255, 255, 255);
                padding: 20px; /* 移动端减小边距 */
            }

            .container {
                text-align: center;
                background: rgba(0, 0, 0, 0.3); /* 加深一点背景让文字更清晰 */
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                padding: 20px;
                border-radius: 20px;
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
                width: 100%;
                max-width: 600px;
                /* 防止内容撑开容器 */
                overflow: hidden; 
            }
            /* 修复移动端padding过大问题 */
            @media (max-width: 480px) {
                .container {
                    padding: 15px; 
                }
            }
            
            .cards-wrapper {
                display: grid; /* 改用Grid布局 */
                grid-template-columns: 1fr 1fr; /* 两列等宽 */
                gap: 15px;
                margin-bottom: 20px;
            }
            
            /* 手机竖屏时，如果宽度太小，卡片自动单列显示(可选，目前两列通常也没问题) */
            @media (max-width: 350px) {
                .cards-wrapper {
                    grid-template-columns: 1fr;
                }
            }

            .card {
                background: rgba(255, 255, 255, 0.05); /* 统一为深色背景 */
                padding: 15px;
                border-radius: 12px;
                transition: transform 0.3s ease;
                /* 去掉边框以保持一致 */
            }

            .card.alarm-glow {
                border: 1px solid rgba(255, 94, 91, 0.85);
                box-shadow: 0 0 18px rgba(255, 94, 91, 0.55);
                animation: alarmPulse 1.1s ease-in-out infinite;
            }

            .alarm-banner {
                display: none;
                margin-top: 8px;
                margin-bottom: 16px;
                padding: 10px 12px;
                border-radius: 10px;
                background: rgba(255, 94, 91, 0.2);
                border: 1px solid rgba(255, 94, 91, 0.65);
                color: #ffd9d8;
                font-size: 0.92rem;
                font-weight: 600;
                text-align: left;
            }

            @keyframes alarmPulse {
                0% { box-shadow: 0 0 8px rgba(255, 94, 91, 0.4); }
                50% { box-shadow: 0 0 22px rgba(255, 94, 91, 0.78); }
                100% { box-shadow: 0 0 8px rgba(255, 94, 91, 0.4); }
            }

            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
                font-weight: 700;
                text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            }

            h2 {
                font-size: 1rem;
                opacity: 0.9;
                margin-bottom: 5px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            /* 优化数值显示：大数字，清晰 */
            .value-box {
                margin: 10px 0;
                display: flex;
                justify-content: center;
                align-items: baseline; /* 基线对齐，让单位沉底 */
            }
            
            .value-box .val-number {
                font-size: 2.5rem; /* 大字体 */
                font-weight: 700;
                line-height: 1;
                /* 加上一点阴影防背景干扰 */
                text-shadow: 0 2px 4px rgba(0,0,0,0.3); 
            }

            .value-box .val-unit {
                font-size: 1.2rem;
                margin-left: 4px;
                opacity: 0.8;
                font-weight: 500;
            }

            .card.reading-stale .val-number {
                color: rgba(255, 255, 255, 0.65);
                letter-spacing: 1px;
            }

            .card.reading-stale .val-unit {
                opacity: 0.45;
            }

            .reading-hint {
                margin-top: 4px;
                font-size: 0.82rem;
                color: rgba(255, 255, 255, 0.72);
                text-align: center;
                min-height: 1.1em;
            }

            /* 图表容器优化 - 统一外观 */
            .chart-wrapper {
                background: rgba(255, 255, 255, 0.05);
                border-radius: 12px;
                padding: 10px;
                width: 100%;
                /* 关键：给图表容器一个固定高度（或者vh），防止被压扁 */
                height: 350px; 
                position: relative;
            }

            /* 历史数据区块 - 平铺式仪表盘布局 */
            .history-section {
                margin-top: 30px;
                width: 100%;
                border-top: 1px solid rgba(255,255,255,0.1);
                padding-top: 20px;
                text-align: left;
            }
            
            .section-title {
                font-size: 1.2rem;
                margin-bottom: 15px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .history-grid {
                display: grid;
                grid-template-columns: 1fr; /* 默认单列 (移动端) */
                gap: 15px;
            }

            /* 分区内的小卡片 */
            .history-card {
                background: rgba(255,255,255,0.05); /* 比主卡片深一点 */
                border-radius: 12px;
                padding: 15px;
                /* 关键修复：防止Grid子项被内容撑大导致溢出 */
                min-width: 0;
                overflow: hidden; /* 确保内容不会溢出圆角 */
            }

            .history-columns-wrapper {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .history-item {
                display: flex;
                flex-direction: column;
                margin-bottom: 8px;
            }
            .label { font-size: 0.8rem; color: #ccc; }
            .val   { font-size: 1.1rem; font-weight: bold; }
            
            .text-red { color: #ff6384; }
            .text-blue { color: #36a2eb; }

            /* 弹窗模态框样式 */
            .modal-overlay {
                display: none; /* 默认隐藏 */
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(5px);
                -webkit-backdrop-filter: blur(5px);
                z-index: 1000;
                justify-content: center;
                align-items: center;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .modal-overlay.show {
                display: flex;
                opacity: 1;
            }

            .modal-content {
                background: rgba(30, 45, 80, 0.95);
                padding: 30px;
                border-radius: 16px;
                width: 90%;
                max-width: 400px;
                position: relative;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                transform: translateY(-20px);
                transition: transform 0.3s ease;
                border: 1px solid rgba(255,255,255,0.1);
            }

            .modal-overlay.show .modal-content {
                transform: translateY(0);
            }

            .close-btn {
                position: absolute;
                top: 15px;
                right: 20px;
                font-size: 1.5rem;
                cursor: pointer;
                opacity: 0.7;
                transition: opacity 0.2s;
            }

            .close-btn:hover { opacity: 1; }

            .input-group {
                margin-bottom: 20px;
                text-align: left;
            }

            .input-group label {
                display: block;
                margin-bottom: 8px;
                font-size: 0.9rem;
                color: #ccc;
            }

            .input-group input {
                width: 100%;
                padding: 12px;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.2);
                background: rgba(0,0,0,0.2);
                color: white;
                font-size: 1rem;
                outline: none;
                transition: border-color 0.2s;
            }

            .input-group input:focus {
                border-color: #36a2eb;
            }

            .submit-btn {
                width: 100%;
                padding: 12px;
                background: linear-gradient(135deg, #36a2eb 0%, #1e3c72 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1.1rem;
                font-weight: bold;
                cursor: pointer;
                transition: box-shadow 0.2s;
            }

            .submit-btn:hover {
                box-shadow: 0 4px 15px rgba(54, 162, 235, 0.4);
            }

            .settings-btn {
                background: none;
                border: none;
                color: white;
                cursor: pointer;
                opacity: 0.7;
                transition: opacity 0.2s, transform 0.2s;
                padding: 5px;
            }

            .settings-btn:hover {
                opacity: 1;
                transform: scale(1.1) rotate(15deg);
            }

            .status-msg {
                margin-top: 15px;
                font-size: 0.9rem;
                text-align: center;
                display: none;
            }

            /* 响应式适配：宽屏设备 (>= 768px) 改为横向分栏 */
            @media (min-width: 768px) {
                .container {
                    max-width: 900px; /* 放宽容器限制 */
                }
                .history-grid {
                    grid-template-columns: 1fr 1fr; /* 两列布局 */
                    /* 今日与昨日在第一排, 趋势图在旁边或者下面?
                       方案: 左边两块(今日+昨日) 堆叠, 右边放图表 */
                    grid-template-areas: 
                        "today chart"
                        "yest chart";
                }
                /* 如果希望今日昨日并排，图表在下，不需要特殊 grid-area */
                .history-grid {
                   grid-template-columns: 1fr 1fr; /* 今日 | 昨日 */
                }
                /* 专门给图表留一个跨两列的位置 */
                .history-chart-full {
                    grid-column: span 2;
                }
            }
        </style>
    </head>
    <body>
        <!-- Wi-Fi 配网弹窗 -->

        </div>

        <div class="container">

            <div class="header-area" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">

                        <path d="M738.133333 392.533333a286.72 286.72 0 0 1 143.786667 36.693334 34.133333 34.133333 0 0 1-35.84 58.026666 218.453333 218.453333 0 0 0-215.893333 1.28 34.133333 34.133333 0 0 1-35.84-58.453333 286.72 286.72 0 0 1 143.786666-37.546667zM512 618.666667A106.666667 106.666667 0 1 1 512 832a106.666667 106.666667 0 0 1 0-213.333334z m338.346667-422.4a494.506667 494.506667 0 0 1 202.666666 43.52 34.133333 34.133333 0 1 1-26.026666 63.146666 426.24 426.24 0 0 0-464.213334 5.546667 34.133333 34.133333 0 0 1-37.546666-56.32 494.933333 494.933333 0 0 1 325.12-55.893333z" p-id="1234"></path>
                    </svg>

            <div class="cards-wrapper">
                <!-- 温度卡片 -->

                    <h2>温度</h2>

                    <div id="hum-hint" class="reading-hint"></div>

            <div id="tempAlarmBanner" class="alarm-banner"></div>

            <!--图表显示区域 独立且固定高度-->

                <canvas id="tempChart"></canvas>
             </div>

              <!-- 独立报警配置卡片 -->
              <div class="card" style="margin-top: 20px; margin-bottom: 25px; padding: 15px 20px; display: flex; flex-direction: column; gap: 18px;">
                  <div style="display: flex; align-items: center; gap: 12px;">
                      <div style="font-size: 1.8rem; background: rgba(255, 94, 91, 0.15); width: 44px; height: 44px; border-radius: 12px; display: flex; justify-content: center; align-items: center;">
                          🚨
                      </div>
                      <div>
                          <h3 style="margin: 0; font-size: 1.05rem; font-weight: 600;">高温报警</h3>
                          <p style="margin: 3px 0 0 0; font-size: 0.8rem; color: rgba(255,255,255,0.5);">当系统温度超过设定阈值时起效</p>

                  <div style="display: flex; align-items: center; justify-content: center; margin: 0 auto; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 6px 12px; gap: 10px;">

                            </div>

                    </div>

                    <!-- 昨日统计 (模拟展示) -->
                    <div class="history-card">
                         <h3>昨日回顾</h3>
                         <div class="history-columns-wrapper" style="margin-top:10px;">

                                <span class="label">最高温度</span>

                    <!-- 一周温度趋势图 -->

        <!-- 温湿度显示脚本 -->
        <script>
            let pollingTimer = null; // 轮询定时器
            let ws = null; // WebSocket 对象

            // 报警控制变量
            let alarmThreshold = 30.0;
            let isAlarmActive = false; // 报警状态标志
            let isFirstLoad = true;    // 首次加载标志
            let lastWebAlarmPopupAt = 0;

            document.addEventListener("DOMContentLoaded", function () {
                const thresholdInput = document.getElementById("alarmThresholdInput");
                if(thresholdInput) {
                    thresholdInput.addEventListener("change", function(e) {
                        alarmThreshold = parseFloat(e.target.value) || 30.0;
                        isAlarmActive = false; // 重置报警状态
                        clearWebHighTempAlert();
                    });
                }
            });

            // 保存报警阈值
            function saveAlarmThreshold() {
                const inputVal = document.getElementById("alarmThresholdInput").value;
                const newThreshold = parseFloat(inputVal);
                if (isNaN(newThreshold)) {
                    alert("请输入有效的温度数字！");
                    return;
                }
                
                // 更新本地状态
                alarmThreshold = newThreshold;
                isAlarmActive = false;
                clearWebHighTempAlert();
                
                // 提交报警阈值到后端
                fetch('/set_alarm', {
                    method: 'POST',
                    cache: 'no-store',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ threshold: newThreshold })
                })
                .then(res => res.json())
                .then(resData => {
                    if (resData.status === "ok") {
                        if (window.AndroidBridge && window.AndroidBridge.triggerAlert) {
                            window.AndroidBridge.triggerAlert("设置成功", "报警阈值已保存为 " + newThreshold + "℃", "success");
                        } else {
                            alert("报警阈值已成功保存到设备！");
                        }
                    } else {
                         alert("保存失败，请稍后重试");
                    }
                })
                .catch(err => {
                    console.error('Save Alarm Error:', err);
                    alert("保存失败：网络连接异常");
                });
            }

            function showWebHighTempAlert(currentTemp) {
                const banner = document.getElementById("tempAlarmBanner");
                if (banner) {
                    banner.innerText = "高温预警：当前 " + currentTemp.toFixed(1) + "°C，阈值 " + alarmThreshold.toFixed(1) + "°C";
                    banner.style.display = "block";
                }

                const tempCard = document.getElementById("tempCard");
                if (tempCard) {
                    tempCard.classList.add("alarm-glow");
                }
            }

            function clearWebHighTempAlert() {
                const banner = document.getElementById("tempAlarmBanner");
                if (banner) {
                    banner.style.display = "none";
                    banner.innerText = "";
                }

                const tempCard = document.getElementById("tempCard");
                if (tempCard) {
                    tempCard.classList.remove("alarm-glow");
                }
            }

            function updateReadingDisplay(cardId, valueId, unitId, hintId, value, unit, valid, placeholderText, hintText) {
                const card = document.getElementById(cardId);
                const valueEl = document.getElementById(valueId);
                const unitEl = document.getElementById(unitId);
                const hintEl = document.getElementById(hintId);

                if (!valueEl || !unitEl || !hintEl) {
                    return;
                }

                if (valid) {
                    valueEl.innerText = value;
                    unitEl.innerText = unit;
                    hintEl.innerText = "";
                    if (card) card.classList.remove("reading-stale");
                } else {
                    valueEl.innerText = placeholderText;
                    unitEl.innerText = "";
                    hintEl.innerText = hintText;
                    if (card) card.classList.add("reading-stale");
                }
            }

            // 图表配置
            const ctx = document.getElementById('tempChart').getContext('2d');
            const myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '温度 (°C)',
                            data: [],
                            borderColor: 'rgba(255, 99, 132, 1)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            tension: 0.4,
                            borderWidth: 2,
                            yAxisID: 'y'
                        },
                        {
                            label: '湿度 (%)',
                            data: [],
                            borderColor: 'rgba(54, 162, 235, 1)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            tension: 0.4,
                            borderWidth: 2,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    animation: {
                        duration: 1000, 
                        easing: 'easeOutQuart'
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: '温度' },
                            min: 0,
                            max: 50
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: '湿度' },
                            min: 0,
                            max: 100,
                            grid: {
                                drawOnChartArea: false,
                            }
                        }
                    }
                }
            });

            // 公用界面更新函数
            function updateUI(data) {
                // 更新报警阈值
                if (data.alarmThreshold) {
                    let serverThreshold = parseFloat(data.alarmThreshold);
                    if (!isNaN(serverThreshold)) {
                        alarmThreshold = serverThreshold;
                        
                        // 非编辑状态下同步输入框
                        const inputEl = document.getElementById("alarmThresholdInput");
                        if (document.activeElement !== inputEl) {
                            inputEl.value = serverThreshold;
                        }
                    }
                    isFirstLoad = false;
                }

                // 更新卡片显示
                const tempValue = parseFloat(data.temperature);
                const humValue = parseFloat(data.humidity);
                const tempValid = !isNaN(tempValue);
                const humValid = !isNaN(humValue);

                updateReadingDisplay("tempCard", "temp-val", "temp-unit", "temp-hint", data.temperature, "°C", tempValid, "暂无", "当前温度暂不可用，等待下一次采样");
                updateReadingDisplay("humCard", "hum-val", "hum-unit", "hum-hint", data.humidity, "%", humValid, "暂无", "当前湿度暂不可用，等待下一次采样");

                // 高温报警
                let currentTemp = tempValue;
                if (!isNaN(currentTemp)) {
                    // 温度超过阈值
                    if (currentTemp > alarmThreshold) {
                        showWebHighTempAlert(currentTemp);
                        // 去重报警提示
                        if (!isAlarmActive) {
                            isAlarmActive = true;
                            if (window.AndroidBridge && window.AndroidBridge.triggerAlert) {
                                window.AndroidBridge.triggerAlert(
                                    "温度过高警告！", 
                                    "当前温度已达到 " + currentTemp + "℃，请注意！",
                                    "alert"
                                );
                            } else {
                                const now = Date.now();
                                if (now - lastWebAlarmPopupAt > 30000) {
                                    lastWebAlarmPopupAt = now;
                                    alert("温度过高警告！当前温度 " + currentTemp.toFixed(1) + "℃，请注意散热。");
                                }
                            }
                        }
                    } else {
                        // 温度恢复后解除报警
                        isAlarmActive = false;
                        clearWebHighTempAlert();
                    }
                }

                // 更新昨日数据
                if(document.getElementById("yesterday-max-temp")) {
                    if(data.history && data.history[0] && data.history[0] !== null) {
                        const yData = data.history[0];
                        document.getElementById("yesterday-max-temp").innerText = yData.max_temp.toFixed(1) + "°C";
                        document.getElementById("yesterday-min-temp").innerText = yData.min_temp.toFixed(1) + "°C";
                        document.getElementById("yesterday-max-hum").innerText = yData.max_hum.toFixed(1) + "%";
                        document.getElementById("yesterday-min-hum").innerText = yData.min_hum.toFixed(1) + "%";
                    } else {
                        document.getElementById("yesterday-max-temp").innerText = "--";
                        document.getElementById("yesterday-min-temp").innerText = "--";
                        document.getElementById("yesterday-max-hum").innerText = "--";
                        document.getElementById("yesterday-min-hum").innerText = "--";
                    }
                }
                
                // 更新今日数据
                if(document.getElementById("today-max-temp")) {
                    document.getElementById("today-max-temp").innerText = data.max_temp_today + "°C";
                    document.getElementById("today-min-temp").innerText = data.min_temp_today + "°C";
                    document.getElementById("today-max-hum").innerText = data.max_hum_today + "%";
                    document.getElementById("today-min-hum").innerText = data.min_hum_today + "%";
                }
        
                // 更新折线图
                const now = new Date();
                const timeLabel = now.getHours() + ':' + now.getMinutes() + ':' + now.getSeconds();
                const readingValid = data.reading_valid !== false;

                if (!readingValid) {
                    clearWebHighTempAlert();
                }

                // 维护滑动窗口
                if (myChart.data.labels.length >= 5) {
                    myChart.data.labels.shift();
                    myChart.data.datasets[0].data.shift();
                    myChart.data.datasets[1].data.shift();
                }

                myChart.data.labels.push(timeLabel);

                // 无效数据记为 null
                myChart.data.datasets[0].data.push(readingValid && tempValid ? tempValue : null);
                myChart.data.datasets[1].data.push(readingValid && humValid ? humValue : null);

                if (!readingValid) {
                    const tempCard = document.getElementById("tempCard");
                    const humCard = document.getElementById("humCard");
                    if (tempCard) tempCard.classList.add("reading-stale");
                    if (humCard) humCard.classList.add("reading-stale");
                }

                // 刷新图表
                myChart.update();

                // 更新历史柱状图
                // 初始化数据容器
                let tempLabels = [];
                let tempHighs = [];
                let tempLows = [];
                let humHighs = [];
                let humLows = [];
                const weekdayMap = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

                if (data.history) {
                    // 倒序遍历历史数据
                    for (let i = 6; i >= 0; i--) {
                        const dayData = data.history[i];
                        if (dayData && dayData !== null) {
                            tempLabels.push(weekdayMap[dayData.weekday]);
                            tempHighs.push(dayData.max_temp);
                            tempLows.push(dayData.min_temp);
                            humHighs.push(dayData.max_hum);
                            humLows.push(dayData.min_hum);
                        } else {
                            tempLabels.push(weekdayMap[(new Date().getDay() - (6 - i) + 7) % 7]);
                            tempHighs.push(null); 
                            tempLows.push(null);
                            humHighs.push(null);
                            humLows.push(null);
                        }
                    }
                }
                // 更新温度周图
                if (typeof myWeeklyChart !== 'undefined' && myWeeklyChart) {
                    myWeeklyChart.data.labels = tempLabels;
                    myWeeklyChart.data.datasets[0].data = tempHighs;
                    myWeeklyChart.data.datasets[1].data = tempLows;
                    myWeeklyChart.update();
                }

                // 更新湿度周图
                if (typeof myWeeklyHumChart !== 'undefined' && myWeeklyHumChart) {
                    myWeeklyHumChart.data.labels = tempLabels;
                    myWeeklyHumChart.data.datasets[0].data = humHighs;
                    myWeeklyHumChart.data.datasets[1].data = humLows;
                    myWeeklyHumChart.update();
                }
            }

            const DATA_REFRESH_INTERVAL_MS = 3000;

            // HTTP 轮询兜底
            function fetchData() {
                // 禁用缓存
                fetch('/data?t=' + Date.now(), { cache: 'no-store' })
                    .then(response => response.json())
                    .then(data => {
                        updateUI(data);
                    })
                    .catch(error => console.error('HTTP Fetch Error:', error));
            }

            // WebSocket 实时连接
            let lastWsMessageTime = 0;
            let wsReconnectTimer = null;

            function initWebSocket() {
                console.log("尝试建立 WebSocket 实时连接...");

                // 清理旧定时器
                if (typeof pollingTimer !== 'undefined') clearInterval(pollingTimer);
                if (typeof wsReconnectTimer !== 'undefined') clearTimeout(wsReconnectTimer);

                // 关闭旧连接
                if (ws) {
                    ws.onclose = null;
                    ws.onerror = null;
                    ws.onmessage = null;
                    ws.onopen = null;
                    if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
                        ws.close();
                    }
                    ws = null;
                }

                const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
                // 兼容 IP 和 mDNS
                ws = new WebSocket(wsProtocol + window.location.host + "/ws");
                lastWsMessageTime = Date.now();

                ws.onopen = function() {
                    console.log("WebSocket 连接成功");
                    // 连接成功后关闭轮询
                    clearInterval(pollingTimer);
                    lastWsMessageTime = Date.now();
                    
                    pollingTimer = setInterval(() => {
                        if(ws && ws.readyState === WebSocket.OPEN) {
                            ws.send("get"); 
                            
                            // 心跳超时处理
                            if (Date.now() - lastWsMessageTime > 8000) {
                                console.warn("WS 心跳超时，准备重连");
                                ws.close();
                            }
                        }
                    }, DATA_REFRESH_INTERVAL_MS);
                };

                ws.onmessage = function(event) {
                    lastWsMessageTime = Date.now();
                    // 解析并更新界面
                    try {
                        const data = JSON.parse(event.data);
                        updateUI(data);
                    } catch (e) {
                         console.error("WS 数据解析失败", e);
                    }
                };

                ws.onclose = function() {
                     console.warn("WebSocket 已断开，切换到 HTTP 兜底");
                     // 清理重连状态
                     clearInterval(pollingTimer);
                     
                     // 启用 HTTP 兜底
                     pollingTimer = setInterval(fetchData, DATA_REFRESH_INTERVAL_MS); 
                     
                     // 安排重连
                     clearTimeout(wsReconnectTimer);
                     wsReconnectTimer = setTimeout(initWebSocket, 8000);
                };
                
                ws.onerror = function(err) {
                    console.error("WS 错误: ", err);
                    // 错误处理交给 close
                };
            }

            // 监听网络变化
            window.addEventListener('online', () => { 
                console.log("检测到网络切换或恢复！立即重置通讯连接！");
                if(ws) ws.close(); 
            });
            window.addEventListener('pagehide', () => { if(ws) ws.close(); });
            window.addEventListener('unload', () => { if(ws) ws.close(); });
            window.addEventListener('beforeunload', () => { if(ws) ws.close(); });
            window.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    // 页面恢复可见时重连
                    if(ws && ws.readyState !== WebSocket.OPEN) initWebSocket();
                }
            });

            // 时间同步
            function syncTime() {
                // 获取浏览器时间
                const timestamp = Math.floor(Date.now() / 1000);
                console.log("正在同步时间:", timestamp);

                // 提交时间同步请求
                fetch('/sync_time', {
                    method: 'POST',
                    cache: 'no-store',
                    body: timestamp.toString()
                })
                .then(response => {
                    if (response.ok) {
                        console.log("时间同步成功");
                    } else {
                        console.error("时间同步失败");
                    }
                })
                .catch(error => console.error('同步请求出错:', error));
            }
            // 页面加载后同步时间
            syncTime();
            
            // 启动数据连接
            fetchData();
            initWebSocket();

            // Wi-Fi 配网弹窗
            function openWifiModal() {
                const modal = document.getElementById("wifiModal");
                modal.style.display = "flex";
                // 触发重绘
                setTimeout(() => modal.classList.add("show"), 10);
                document.getElementById("wifiStatus").style.display = "none";
            }

            function closeWifiModal() {
                const modal = document.getElementById("wifiModal");
                modal.classList.remove("show");
                setTimeout(() => modal.style.display = "none", 300);
            }

            function submitWifi(event) {
                event.preventDefault(); // 阻止表单默认跳转
                
                const ssid = document.getElementById("ssid").value;
                const password = document.getElementById("password").value;
                const btn = document.getElementById("wifiSubmitBtn");
                const status = document.getElementById("wifiStatus");
                
                btn.innerText = "正在下发...";
                btn.disabled = true;
                btn.style.opacity = "0.7";
                
                fetch('/wifi_config', {
                    method: 'POST',
                    cache: 'no-store',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid: ssid, password: password })
                })
                .then(response => response.json()) // 修改：解析 JSON 响应
                .then(data => {
                    status.style.display = "block";
                    if (data.status === "ok") {
                        status.style.color = "#4ade80";
                        status.innerText = "连接成功！设备IP: " + data.ip;
                        // 这里可以让弹窗多停几秒让用户看到 IP
                        setTimeout(() => {
                            closeWifiModal();
                            btn.innerText = "连接";
                            btn.disabled = false;
                            btn.style.opacity = "1";
                            document.getElementById("wifiForm").reset();
                        }, 5000); // 改为5秒后关闭
                    } else if(data.status === "timeout") {
                        status.style.color = "#fbbf24";
                        status.innerText = "连接超时，可能密码错误或网络不佳";
                        btn.innerText = "重新连接";
                        btn.disabled = false;
                        btn.style.opacity = "1";
                    } else {
                        throw new Error('网络请求失败');
                    }
                })
                .catch(error => {
                    status.style.display = "block";
                    status.style.color = "#ef4444";
                    status.innerText = "下发失败，请重试";
                    btn.innerText = "连接";
                    btn.disabled = false;
                    btn.style.opacity = "1";
                });
            }

            // 点击模态框背景关闭弹窗
            document.getElementById("wifiModal").addEventListener("click", function(e) {
                if (e.target === this) closeWifiModal();
            });

            // === 初始化本周趋势图 (放在最后初始化) ===
            var myWeeklyChart; // 必须声明为全局变量，否则fetchData里访问不到
            const ctxWeekly = document.getElementById('weeklyChart').getContext('2d');
            myWeeklyChart = new Chart(ctxWeekly, {
                type: 'bar', 
                data: {
                    labels: [], // 等待 fetchData 填充
                    datasets: [{
                        label: '最高温度',
                        data: [],
                        backgroundColor: 'rgba(255, 99, 132, 0.5)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    },
                    {
                        label: '最低温度',
                        data: [],
                        backgroundColor: 'rgba(255, 159, 64, 0.5)',
                        borderColor: 'rgba(255, 159, 64, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }, 
                    scales: { y: { beginAtZero: false } }
                }
            });

            // === 初始化本周湿度趋势图 ===
            var myWeeklyHumChart;
            const ctxWeeklyHum = document.getElementById('weeklyHumChart').getContext('2d');
            myWeeklyHumChart = new Chart(ctxWeeklyHum, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: '最高湿度',
                        data: [],
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: '最低湿度',
                        data: [],
                        backgroundColor: 'rgba(75, 192, 192, 0.5)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } },
                    scales: { y: { beginAtZero: true, min: 0, max: 100 } }
                }
            });
        </script>
    </body>
</html>
